name: Android Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for an official release build (e.g. v1.1.0). Leave blank for an untagged artifact-only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # For a PR event, build the PR's actual head commit rather than
          # the synthetic merge commit checkout defaults to — that's also
          # what the tag below needs to point at.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk FitLog-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitLog-Android-APK
          path: FitLog-debug.apk

      # Every PR gets its own tag (pr-<number>), re-pointed at HEAD on each
      # new push to the PR — so there's always a real tag + release to grab
      # a build from, without pushing a v* tag by hand.
      - name: Tag PR build
        if: github.event_name == 'pull_request'
        id: pr_tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A manual run can request an official tagged release too (for when
      # pushing the tag directly isn't an option) — the tag comes in via env,
      # never interpolated straight into the script, since workflow_dispatch
      # inputs are still free-form operator text.
      - name: Tag manual build
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        id: manual_tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || steps.manual_tag.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'pull_request' && steps.pr_tag.outputs.tag || steps.manual_tag.outputs.tag || github.ref_name }}
          name: "${{ github.event_name == 'pull_request' && format('PR #{0} build', github.event.pull_request.number) || steps.manual_tag.outputs.tag || github.ref_name }}"
          prerelease: ${{ github.event_name == 'pull_request' }}
          files: FitLog-debug.apk
          generate_release_notes: true
