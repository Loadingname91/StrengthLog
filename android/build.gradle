// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Phase 8 (v1.2): the notification service/plugin are written in
        // Kotlin, matching Capacitor's own official plugin convention — this
        // project had no Kotlin source before that. Hardcoded (not read from
        // variables.gradle) because buildscript{} is evaluated before
        // `apply from: "variables.gradle"` below runs — kept in sync with
        // variables.gradle's own kotlinVersion by convention, not reference.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
